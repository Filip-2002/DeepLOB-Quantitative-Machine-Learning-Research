model:
  name: cnn_attention
  num_classes: 3
  conv_filters: 32
  leaky_relu_slope: 0.01
  inception_filters: 64
  n_heads: 4
  n_encoder_layers: 2
  dim_feedforward: 128
  dropout: 0.1
  max_seq_len: 120
data:
  dataset: fi2010
  normalization: DecPre
  lookback: 100
  horizon: 10
  num_levels: 10
  setup: 2
  data_dir: data/processed_diverse
training:
  batch_size: 64
  learning_rate: 0.001
  optimizer: adam
  adam_epsilon: 1.0e-08
  warmup_epochs: 5
  max_epochs: 30
  early_stopping_patience: 8
  seed: 42
logging:
  wandb_project: deeplob-extension
  save_dir: experiments/laptop_cnn_attention
  log_every_n_steps: 100
